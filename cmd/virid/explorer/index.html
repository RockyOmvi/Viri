<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viri Block Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090a0f;
    --panel: #11141c;
    --panel-border: rgba(255, 255, 255, 0.07);
    --panel-hover: #161b26;
    --accent: #f5a623;
    --accent-glow: rgba(245, 166, 35, 0.2);
    --primary: #6366f1;
    --text: #f3f4f6;
    --muted: #94a3b8;
    --success: #10b981;
    --success-bg: rgba(16, 185, 129, 0.12);
    --info: #06b6d4;
    --info-bg: rgba(6, 182, 212, 0.12);
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(circle at 50% -20%, #171c2c 0%, var(--bg) 60%);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.9rem 2rem;
    background: rgba(17, 20, 28, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--panel-border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    text-decoration: none;
    color: var(--text);
    cursor: pointer;
  }
  .brand-logo {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--accent), #e65100);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    color: #121212;
    font-size: 1.1rem;
    box-shadow: 0 0 16px var(--accent-glow);
  }
  .brand-text {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .brand-badge {
    background: rgba(16, 185, 129, 0.15);
    color: var(--success);
    font-size: 0.68rem;
    padding: 0.2rem 0.55rem;
    border-radius: 999px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    border: 1px solid rgba(16, 185, 129, 0.3);
  }
  .pulse-dot {
    width: 6px;
    height: 6px;
    background: var(--success);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { transform: scale(0.95); opacity: 0.7; }
    50% { transform: scale(1.3); opacity: 1; }
    100% { transform: scale(0.95); opacity: 0.7; }
  }
  .search-container {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex: 1;
    max-width: 580px;
    margin: 0 2rem;
  }
  .search-box {
    display: flex;
    align-items: center;
    background: #0d0f15;
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 0.3rem 0.8rem;
    width: 100%;
    transition: all 0.2s;
  }
  .search-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .search-box input {
    background: transparent;
    border: none;
    color: var(--text);
    outline: none;
    font-size: 0.85rem;
    width: 100%;
    font-family: 'JetBrains Mono', monospace;
  }
  .search-box button {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 0.35rem 0.8rem;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s;
  }
  .search-box button:hover { filter: brightness(1.1); }
  .container {
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    padding: 1.5rem 1.5rem 3rem;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 1.1rem 1.3rem;
    transition: transform 0.2s, border-color 0.2s;
  }
  .stat-card:hover {
    border-color: rgba(255,255,255,0.15);
    transform: translateY(-2px);
  }
  .stat-label {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }
  .stat-val {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--text);
    margin-top: 0.4rem;
    letter-spacing: -0.02em;
  }
  .stat-val.accent { color: var(--accent); }
  .stat-val.success { color: var(--success); }
  .stat-sub {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 0.25rem;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 1.4rem;
    margin-bottom: 1.5rem;
  }
  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    padding-bottom: 0.8rem;
    border-bottom: 1px solid var(--panel-border);
  }
  .panel-title {
    font-size: 1.05rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .two-col {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 1.5rem;
  }
  @media (max-width: 900px) {
    .two-col { grid-template-columns: 1fr; }
    .search-container { margin: 0 1rem; }
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  th {
    text-align: left;
    color: var(--muted);
    font-weight: 500;
    font-size: 0.75rem;
    padding: 0.6rem 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--panel-border);
  }
  td {
    padding: 0.75rem;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    vertical-align: middle;
  }
  tr:hover td {
    background: rgba(255, 255, 255, 0.02);
  }
  .mono {
    font-family: 'JetBrains Mono', monospace;
  }
  .link {
    color: #60a5fa;
    text-decoration: none;
    cursor: pointer;
  }
  .link:hover { text-decoration: underline; }
  .badge {
    display: inline-block;
    padding: 0.2rem 0.5rem;
    border-radius: 6px;
    font-size: 0.72rem;
    font-weight: 600;
  }
  .badge-success { background: var(--success-bg); color: var(--success); }
  .badge-info { background: var(--info-bg); color: var(--info); }
  .badge-in { background: rgba(16, 185, 129, 0.15); color: #34d399; }
  .badge-out { background: rgba(245, 166, 35, 0.15); color: #fbbf24; }
  .overview-grid {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 0.85rem 1.2rem;
    font-size: 0.88rem;
  }
  .overview-label {
    color: var(--muted);
    font-weight: 500;
  }
  .overview-val {
    word-break: break-all;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .copy-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--muted);
    border-radius: 4px;
    padding: 0.15rem 0.45rem;
    font-size: 0.7rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .copy-btn:hover {
    color: var(--text);
    background: rgba(255,255,255,0.12);
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    background: transparent;
    color: var(--muted);
    border: none;
    cursor: pointer;
    font-size: 0.85rem;
    margin-bottom: 1rem;
    padding: 0;
  }
  .back-btn:hover { color: var(--text); }
  .balance-hero {
    background: linear-gradient(135deg, rgba(245, 166, 35, 0.08), rgba(99, 102, 241, 0.04));
    border: 1px solid rgba(245, 166, 35, 0.25);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .balance-val {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  .footer {
    margin-top: auto;
    border-top: 1px solid var(--panel-border);
    padding: 1.5rem 2rem;
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .empty-state {
    text-align: center;
    padding: 2.5rem;
    color: var(--muted);
  }
</style>
</head>
<body>

<header class="navbar">
  <div class="brand" onclick="navigateTo('/explorer/')">
    <div class="brand-logo">⧫</div>
    <div class="brand-text">
      VIRI
      <span class="brand-badge"><span class="pulse-dot"></span> Testnet 1337</span>
    </div>
  </div>

  <div class="search-container">
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="Search by Address (0x...), Txn Hash, or Block Number..." onkeydown="if(event.key==='Enter') executeSearch()">
      <button onclick="executeSearch()">Search</button>
    </div>
  </div>
</header>

<main class="container" id="mainContainer">
  <!-- Content dynamically populated based on route -->
</main>

<footer class="footer">
  Viri L1/L2 High-Throughput Blockchain &bull; RPC: http://127.0.0.1:8545 &bull; Explorer API: http://127.0.0.1:8546
</footer>

<script>
const formatAddress = (addr) => {
  if (!addr) return '—';
  if (addr.length <= 16) return addr;
  return addr.slice(0, 10) + '…' + addr.slice(-8);
};

const formatHash = (h) => {
  if (!h) return '—';
  if (h.length <= 18) return h;
  return h.slice(0, 10) + '…' + h.slice(-8);
};

const formatViri = (weiStr) => {
  try {
    if (!weiStr || weiStr === '0') return '0 VIRI';
    let s = weiStr.toString();
    if (s.startsWith('0x')) {
      s = BigInt(s).toString();
    }
    const bi = BigInt(s);
    const div = BigInt("1000000000000000000"); // 1e18
    const whole = bi / div;
    const rem = bi % div;
    if (rem === 0n) return whole.toString() + ' VIRI';
    let frac = rem.toString().padStart(18, '0').slice(0, 4);
    return `${whole}.${frac} VIRI`;
  } catch(e) {
    return weiStr + ' wei';
  }
};

const copyText = (txt) => {
  navigator.clipboard.writeText(txt).then(() => {
    alert('Copied to clipboard: ' + txt);
  });
};

const apiFetch = async (endpoint) => {
  const res = await fetch(endpoint);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.json();
};

const navigateTo = (path) => {
  window.history.pushState({}, '', path);
  route();
};

window.addEventListener('popstate', route);

function executeSearch() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) return;
  if (/^0x[a-fA-F0-9]{40}$/.test(query) || (query.length === 40 && /^[a-fA-F0-9]+$/.test(query))) {
    const cleanAddr = query.startsWith('0x') ? query : '0x' + query;
    navigateTo('/explorer/address/' + cleanAddr.toLowerCase());
  } else if (/^0x[a-fA-F0-9]{64}$/.test(query) || (query.length === 64 && /^[a-fA-F0-9]+$/.test(query))) {
    const cleanHash = query.startsWith('0x') ? query : '0x' + query;
    navigateTo('/explorer/tx/' + cleanHash.toLowerCase());
  } else if (/^\d+$/.test(query)) {
    navigateTo('/explorer/block/' + query);
  } else {
    alert('Invalid search query. Enter a 20-byte address, 32-byte transaction hash, or block number.');
  }
}

async function renderDashboard() {
  const c = document.getElementById('mainContainer');
  c.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Block Height</div>
        <div class="stat-val accent" id="dashHeight">—</div>
        <div class="stat-sub">Finalized HotStuff BFT</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Network Peers</div>
        <div class="stat-val" id="dashPeers">—</div>
        <div class="stat-sub">Active P2P connections</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Node Uptime</div>
        <div class="stat-val success" id="dashUptime">—</div>
        <div class="stat-sub">Seconds elapsed</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Chain ID / Currency</div>
        <div class="stat-val" id="dashChain">1337 / VIRI</div>
        <div class="stat-sub">Local Devnet</div>
      </div>
    </div>

    <div class="two-col">
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Latest Blocks</div>
          <span class="badge badge-info">Live Stream</span>
        </div>
        <table>
          <thead>
            <tr><th>Height</th><th>Block Hash</th><th>Txs</th><th>Age</th></tr>
          </thead>
          <tbody id="blocksTableBody">
            <tr><td colspan="4" class="empty-state">Loading latest blocks…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Network Peers</div>
          <span class="badge badge-success">Mesh</span>
        </div>
        <table>
          <thead>
            <tr><th>Peer ID</th><th>Status</th></tr>
          </thead>
          <tbody id="peersTableBody">
            <tr><td colspan="2" class="empty-state">Loading peers…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  `;

  try {
    const [statusData, blocksData, peersData] = await Promise.all([
      apiFetch('/api/v1/status').catch(() => null),
      apiFetch('/api/v1/blocks?limit=15').catch(() => null),
      apiFetch('/api/v1/peers').catch(() => null)
    ]);

    if (statusData) {
      const d = statusData.data || statusData;
      document.getElementById('dashHeight').textContent = (d.height || d.block_height || 0).toLocaleString();
      document.getElementById('dashPeers').textContent = d.peers || d.peer_count || 0;
      document.getElementById('dashUptime').textContent = (d.uptime_sec || 0) + 's';
      if (d.chain_id) document.getElementById('dashChain').textContent = `${d.chain_id} / VIRI`;
    }

    if (blocksData && blocksData.blocks) {
      const tb = document.getElementById('blocksTableBody');
      tb.innerHTML = '';
      blocksData.blocks.forEach(b => {
        const height = b.number ? parseInt(b.number, 16) : b.height;
        const hash = b.hash || '';
        const txCount = b.transactions ? b.transactions.length : 0;
        const ts = b.timestamp ? new Date(parseInt(b.timestamp, 16) * 1000).toLocaleTimeString() : '';
        tb.innerHTML += `
          <tr>
            <td><a class="link mono" onclick="navigateTo('/explorer/block/${height}')">#${height}</a></td>
            <td><span class="mono" title="${hash}">${formatHash(hash)}</span></td>
            <td><span class="badge badge-success">${txCount} txs</span></td>
            <td style="color:var(--muted); font-size:0.75rem">${ts}</td>
          </tr>
        `;
      });
    }

    if (peersData && peersData.peers) {
      const pb = document.getElementById('peersTableBody');
      if (peersData.peers.length === 0) {
        pb.innerHTML = `<tr><td colspan="2" class="empty-state">Standalone Local Validator Mode (0 external peers)</td></tr>`;
      } else {
        pb.innerHTML = '';
        peersData.peers.forEach(p => {
          pb.innerHTML += `
            <tr>
              <td class="mono">${(p.peer_id || p.id || '').slice(0, 16)}…</td>
              <td><span class="badge badge-success">Connected</span></td>
            </tr>
          `;
        });
      }
    }
  } catch(e) {
    console.error('Failed to load dashboard data:', e);
  }
}

async function renderAddress(address) {
  const c = document.getElementById('mainContainer');
  c.innerHTML = `
    <button class="back-btn" onclick="navigateTo('/explorer/')">&larr; Back to Dashboard</button>
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <span>Account Overview</span>
        </div>
        <span class="badge badge-info" id="acctTypeBadge">EOA</span>
      </div>

      <div class="balance-hero">
        <div>
          <div style="font-size:0.8rem; color:var(--muted); text-transform:uppercase; font-weight:600">Total VIRI Balance</div>
          <div class="balance-val" id="acctBalanceHero">—</div>
          <div class="mono" style="font-size:0.8rem; color:var(--muted)" id="acctBalanceRaw"></div>
        </div>
        <div>
          <span class="badge badge-success" style="font-size:0.85rem; padding:0.4rem 0.8rem">Chain 1337</span>
        </div>
      </div>

      <div class="overview-grid">
        <div class="overview-label">Address</div>
        <div class="overview-val mono">
          <span id="acctAddress">${address}</span>
          <button class="copy-btn" onclick="copyText('${address}')">Copy</button>
        </div>

        <div class="overview-label">Transaction Nonce</div>
        <div class="overview-val mono" id="acctNonce">—</div>

        <div class="overview-label">Contract Code</div>
        <div class="overview-val" id="acctHasCode">None (Standard Wallet Account)</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">Recent Transactions</div>
        <span class="badge badge-info" id="recentTxCount">Scanning…</span>
      </div>

      <table>
        <thead>
          <tr>
            <th>Tx Hash</th>
            <th>Block</th>
            <th>From</th>
            <th>Direction</th>
            <th>To</th>
            <th>Value</th>
          </tr>
        </thead>
        <tbody id="acctTxsBody">
          <tr><td colspan="6" class="empty-state">Loading transactions involving this account…</td></tr>
        </tbody>
      </table>
    </div>
  `;

  try {
    const data = await apiFetch('/api/v1/accounts/' + address);
    document.getElementById('acctBalanceHero').textContent = formatViri(data.balance);
    document.getElementById('acctBalanceRaw').textContent = `${data.balance} wei`;
    document.getElementById('acctNonce').textContent = data.nonce ?? '0';
    if (data.has_code) {
      document.getElementById('acctTypeBadge').textContent = 'Smart Contract';
      document.getElementById('acctHasCode').textContent = 'Deployed EVM Bytecode Present';
    }

    const txsBody = document.getElementById('acctTxsBody');
    const recent = data.recent_transactions || [];
    document.getElementById('recentTxCount').textContent = `${recent.length} found`;

    if (recent.length === 0) {
      txsBody.innerHTML = `<tr><td colspan="6" class="empty-state">No transactions found for this account in recent blocks.</td></tr>`;
    } else {
      txsBody.innerHTML = '';
      const lowerAddr = address.toLowerCase();
      recent.forEach(tx => {
        const isOut = tx.from && tx.from.toLowerCase() === lowerAddr;
        const dirBadge = isOut ? '<span class="badge badge-out">OUT</span>' : '<span class="badge badge-in">IN</span>';
        txsBody.innerHTML += `
          <tr>
            <td>
              <a class="link mono" onclick="navigateTo('/explorer/tx/${tx.hash}')">${formatHash(tx.hash)}</a>
              <button class="copy-btn" onclick="copyText('${tx.hash}')">Copy</button>
            </td>
            <td><a class="link mono" onclick="navigateTo('/explorer/block/${tx.block_height}')">#${tx.block_height}</a></td>
            <td><span class="mono">${formatAddress(tx.from)}</span></td>
            <td>${dirBadge}</td>
            <td><span class="mono">${formatAddress(tx.to)}</span></td>
            <td class="mono" style="font-weight:600; color:var(--accent)">${formatViri(tx.value)}</td>
          </tr>
        `;
      });
    }
  } catch(err) {
    console.error('Failed to load account:', err);
    document.getElementById('acctTxsBody').innerHTML = `<tr><td colspan="6" class="empty-state" style="color:var(--danger)">Error loading account details: ${err.message}</td></tr>`;
  }
}

async function renderTx(txHash) {
  const c = document.getElementById('mainContainer');
  c.innerHTML = `
    <button class="back-btn" onclick="navigateTo('/explorer/')">&larr; Back to Dashboard</button>
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">Transaction Details</div>
        <span class="badge badge-success" id="txStatusBadge">Success</span>
      </div>

      <div class="overview-grid">
        <div class="overview-label">Transaction Hash</div>
        <div class="overview-val mono">
          <span>${txHash}</span>
          <button class="copy-btn" onclick="copyText('${txHash}')">Copy</button>
        </div>

        <div class="overview-label">Status</div>
        <div class="overview-val">
          <span class="badge badge-success" id="txStatusVal">Confirmed on-chain</span>
        </div>

        <div class="overview-label">Block Height</div>
        <div class="overview-val mono" id="txBlockVal">—</div>

        <div class="overview-label">From</div>
        <div class="overview-val mono" id="txFromVal">—</div>

        <div class="overview-label">To</div>
        <div class="overview-val mono" id="txToVal">—</div>

        <div class="overview-label">Value</div>
        <div class="overview-val mono" style="font-size:1.1rem; font-weight:700; color:var(--accent)" id="txValueVal">—</div>

        <div class="overview-label">Gas Limit</div>
        <div class="overview-val mono" id="txGasLimitVal">—</div>

        <div class="overview-label">Gas Price</div>
        <div class="overview-val mono" id="txGasPriceVal">—</div>
      </div>
    </div>
  `;

  try {
    const tx = await apiFetch('/api/v1/transactions/' + txHash);
    document.getElementById('txBlockVal').innerHTML = `<a class="link mono" onclick="navigateTo('/explorer/block/${tx.block_height}')">#${tx.block_height}</a>`;
    document.getElementById('txFromVal').innerHTML = `<a class="link mono" onclick="navigateTo('/explorer/address/${tx.from}')">${tx.from}</a> <button class="copy-btn" onclick="copyText('${tx.from}')">Copy</button>`;
    document.getElementById('txToVal').innerHTML = tx.to ? `<a class="link mono" onclick="navigateTo('/explorer/address/${tx.to}')">${tx.to}</a> <button class="copy-btn" onclick="copyText('${tx.to}')">Copy</button>` : '<em>Contract Deployment</em>';
    document.getElementById('txValueVal').textContent = formatViri(tx.value);
    document.getElementById('txGasLimitVal').textContent = tx.gas_limit ? parseInt(tx.gas_limit).toLocaleString() : '21,000';
    document.getElementById('txGasPriceVal').textContent = tx.gas_price ? (parseInt(tx.gas_price) / 1e9) + ' Gwei' : '1 Gwei';
  } catch(e) {
    document.getElementById('txStatusVal').innerHTML = `<span style="color:var(--danger)">Transaction not found or pending</span>`;
  }
}

async function renderBlock(blockHeight) {
  const c = document.getElementById('mainContainer');
  c.innerHTML = `
    <button class="back-btn" onclick="navigateTo('/explorer/')">&larr; Back to Dashboard</button>
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">Block #${blockHeight}</div>
        <span class="badge badge-success">Finalized</span>
      </div>

      <div class="overview-grid">
        <div class="overview-label">Height</div>
        <div class="overview-val mono">#${blockHeight}</div>

        <div class="overview-label">Block Hash</div>
        <div class="overview-val mono" id="blkHashVal">Loading…</div>

        <div class="overview-label">Parent Hash</div>
        <div class="overview-val mono" id="blkParentVal">—</div>

        <div class="overview-label">Proposer / Miner</div>
        <div class="overview-val mono" id="blkMinerVal">—</div>

        <div class="overview-label">Timestamp</div>
        <div class="overview-val" id="blkTimeVal">—</div>

        <div class="overview-label">Transactions</div>
        <div class="overview-val" id="blkTxCountVal">—</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">Block Transactions</div>
      </div>
      <table>
        <thead>
          <tr><th>Tx Hash</th></tr>
        </thead>
        <tbody id="blkTxList">
          <tr><td class="empty-state">Loading transactions…</td></tr>
        </tbody>
      </table>
    </div>
  `;

  try {
    const blk = await apiFetch('/api/v1/blocks/' + blockHeight);
    document.getElementById('blkHashVal').innerHTML = `<span>${blk.hash}</span> <button class="copy-btn" onclick="copyText('${blk.hash}')">Copy</button>`;
    document.getElementById('blkParentVal').textContent = blk.parentHash || '0x';
    document.getElementById('blkMinerVal').innerHTML = `<a class="link mono" onclick="navigateTo('/explorer/address/${blk.miner}')">${blk.miner}</a>`;
    document.getElementById('blkTimeVal').textContent = blk.timestamp ? new Date(parseInt(blk.timestamp, 16) * 1000).toLocaleString() : '—';
    const txs = blk.transactions || [];
    document.getElementById('blkTxCountVal').textContent = `${txs.length} transactions`;

    const txList = document.getElementById('blkTxList');
    if (txs.length === 0) {
      txList.innerHTML = `<tr><td class="empty-state">No transactions in this block.</td></tr>`;
    } else {
      txList.innerHTML = '';
      txs.forEach(t => {
        const hash = typeof t === 'string' ? t : t.hash;
        txList.innerHTML += `
          <tr>
            <td>
              <a class="link mono" onclick="navigateTo('/explorer/tx/${hash}')">${hash}</a>
              <button class="copy-btn" onclick="copyText('${hash}')">Copy</button>
            </td>
          </tr>
        `;
      });
    }
  } catch(e) {
    document.getElementById('blkHashVal').innerHTML = `<span style="color:var(--danger)">Block not found: ${e.message}</span>`;
  }
}

function route() {
  const p = window.location.pathname;
  if (p.includes('/explorer/address/')) {
    const addr = p.split('/explorer/address/')[1].replace(/\/$/, '');
    renderAddress(addr);
  } else if (p.includes('/explorer/tx/')) {
    const hash = p.split('/explorer/tx/')[1].replace(/\/$/, '');
    renderTx(hash);
  } else if (p.includes('/explorer/block/')) {
    const height = p.split('/explorer/block/')[1].replace(/\/$/, '');
    renderBlock(height);
  } else {
    renderDashboard();
  }
}

// Initial route execution
route();

// Auto-refresh dashboard every 5s if on dashboard
setInterval(() => {
  const p = window.location.pathname;
  if (!p.includes('/address/') && !p.includes('/tx/') && !p.includes('/block/')) {
    renderDashboard();
  }
}, 5000);
</script>
</body>
</html>
