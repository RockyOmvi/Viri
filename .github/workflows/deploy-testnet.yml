name: Deploy Public Testnet

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'testnet'
        type: choice
        options:
          - testnet
          - mainnet
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string

env:
  GO_VERSION: "1.25"
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=${{ inputs.environment }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Testnet VMs
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Install Ansible
        run: |
          pip install ansible

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TESTNET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.BOOTSTRAP_PUBLIC_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H ${{ secrets.VALIDATOR_0_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H ${{ secrets.VALIDATOR_1_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H ${{ secrets.VALIDATOR_2_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H ${{ secrets.VALIDATOR_3_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H ${{ secrets.FAUCET_PUBLIC_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run Ansible playbook
        run: |
          ansible-playbook \
            -i deploy/ansible/inventory/oracle-cloud.yml \
            deploy/ansible/deploy-testnet.yml \
            --extra-vars "bootstrap_peer_id=${{ secrets.BOOTSTRAP_PEER_ID }}" \
            --extra-vars "BOOTSTRAP_PUBLIC_IP=${{ secrets.BOOTSTRAP_PUBLIC_IP }}" \
            --extra-vars "VALIDATOR_0_IP=${{ secrets.VALIDATOR_0_IP }}" \
            --extra-vars "VALIDATOR_1_IP=${{ secrets.VALIDATOR_1_IP }}" \
            --extra-vars "VALIDATOR_2_IP=${{ secrets.VALIDATOR_2_IP }}" \
            --extra-vars "VALIDATOR_3_IP=${{ secrets.VALIDATOR_3_IP }}" \
            --extra-vars "FAUCET_PUBLIC_IP=${{ secrets.FAUCET_PUBLIC_IP }}" \
            --extra-vars "domain=${{ secrets.TESTNET_DOMAIN }}"

      - name: Verify deployment
        run: |
          sleep 10
          for host in "${{ secrets.BOOTSTRAP_PUBLIC_IP }}" "${{ secrets.VALIDATOR_0_IP }}" "${{ secrets.VALIDATOR_1_IP }}" "${{ secrets.VALIDATOR_2_IP }}" "${{ secrets.VALIDATOR_3_IP }}"; do
            echo "Checking $host..."
            curl -s --max-time 10 "http://$host:8545/health" || echo "WARNING: $host not responding"
          done
          echo "Checking faucet..."
          curl -s --max-time 10 "http://${{ secrets.FAUCET_PUBLIC_IP }}:8081/health" || echo "WARNING: faucet not responding"
