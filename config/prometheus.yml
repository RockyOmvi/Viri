global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "viri-validator"
    static_configs:
      - targets: ["validator-0:9090", "validator-1:9090", "validator-2:9090"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
