#cloud-config
package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose-v2
  - curl
  - jq
  - ufw

runcmd:
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker ubuntu

  - ufw --force disable
  - iptables -P INPUT ACCEPT
  - iptables -P FORWARD ACCEPT
  - iptables -P OUTPUT ACCEPT

  - docker pull ghcr.io/viri-chain/viri:latest

  - mkdir -p /opt/viri/{config,data,logs,genesis}

%{ if instance_name == "bootstrap-validator" ~}

  - |
    if [ ! -f /opt/viri/config/bootstrap.key ]; then
      docker run --rm -v /opt/viri/config:/config ghcr.io/viri-chain/viri:latest \
        virid --generate-node-key --key-file /config/bootstrap.key
    fi
  - |
    PEER_ID=$(grep -oP 'peer_id:\s*\K\S+' /opt/viri/config/bootstrap.key || echo "")
    echo "{\"peer_id\":\"$PEER_ID\"}" > /opt/viri/config/bootstrap-id.json

  - |
    if [ ! -f /opt/viri/config/validator.key ]; then
      docker run --rm -v /opt/viri/config:/config ghcr.io/viri-chain/viri:latest \
        virid --generate-validator-key --key-file /config/validator.key
    fi

  - |
    cat > /opt/viri/genesis/genesis.json << 'GENESIS'
${genesis_json}
GENESIS

  - |
    cat > /opt/viri/docker-compose.yml << 'COMPOSE'
services:
  bootstrap:
    image: ghcr.io/viri-chain/viri:latest
    container_name: viri-bootstrap
    ports:
      - "30303:30303"
      - "8545:8545"
      - "8546:8546"
    volumes:
      - /opt/viri/config:/home/viri/config:ro
      - /opt/viri/genesis:/home/viri/genesis:ro
      - /opt/viri/data:/home/viri/.viri
      - /opt/viri/logs:/home/viri/logs
    environment:
      - VIRI_NODE_NAME=bootstrap-0
      - VIRI_LOG_LEVEL=info
      - VIRI_TESTNET=true
      - VIRI_RPC_PORT=8545
      - VIRI_API_PORT=8546
    restart: unless-stopped
    command: ["virid", "--config", "/home/viri/config/config.json"]

  validator-0:
    image: ghcr.io/viri-chain/viri:latest
    container_name: viri-validator-0
    ports:
      - "30304:30303"
      - "8555:8545"
      - "8556:8546"
    volumes:
      - /opt/viri/config:/home/viri/config:ro
      - /opt/viri/genesis:/home/viri/genesis:ro
      - /opt/viri/data/validator-0:/home/viri/.viri
      - /opt/viri/logs:/home/viri/logs
    environment:
      - VIRI_NODE_NAME=validator-0
      - VIRI_LOG_LEVEL=info
      - VIRI_TESTNET=true
      - VIRI_VALIDATOR_MODE=true
      - VIRI_VALIDATOR_KEY=/home/viri/config/validator.key
      - VIRI_RPC_PORT=8545
      - VIRI_API_PORT=8546
      - VIRI_BOOTSTRAP_PEER=/ip4/127.0.0.1/tcp/30303/p2p/$(cat /opt/viri/config/bootstrap-id.json | jq -r '.peer_id')
    restart: unless-stopped
    command: ["virid", "--config", "/home/viri/config/config.json"]
COMPOSE

%{ elif instance_name == "services" ~}

  - |
    cat > /opt/viri/genesis/genesis.json << 'GENESIS'
${genesis_json}
GENESIS

  - |
    cat > /opt/viri/docker-compose.yml << 'COMPOSE'
services:
  faucet:
    image: ghcr.io/viri-chain/viri:latest
    container_name: viri-faucet
    ports:
      - "8081:8081"
      - "30303:30303"
      - "8545:8545"
      - "8546:8546"
    volumes:
      - /opt/viri/config:/home/viri/config:ro
      - /opt/viri/genesis:/home/viri/genesis:ro
    environment:
      - VIRI_LOG_LEVEL=info
      - FAUCET_PORT=8081
      - FAUCET_WALLET_KEY=${faucet_wallet_key}
      - FAUCET_DAILY_LIMIT=1000000000000000000000
      - FAUCET_PER_CLAIM=10000000000000000000
      - FAUCET_COOLDOWN=86400
      - VIRI_RPC_URL=http://BOOTSTRAP_PUBLIC_IP:8545
    restart: unless-stopped
    command: ["virid", "--faucet"]

  explorer:
    image: ghcr.io/viri-chain/viri:latest
    container_name: viri-explorer
    ports:
      - "8080:8080"
    volumes:
      - /opt/viri/config:/home/viri/config:ro
    environment:
      - EXPLORER_PORT=8080
      - VIRI_RPC_URL=http://BOOTSTRAP_PUBLIC_IP:8545
    restart: unless-stopped
    command: ["virid", "--explorer"]

  prometheus:
    image: prom/prometheus:latest
    container_name: viri-prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: viri-grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
COMPOSE

%{ else ~}

  - |
    if [ ! -f /opt/viri/config/validator.key ]; then
      docker run --rm -v /opt/viri/config:/config ghcr.io/viri-chain/viri:latest \
        virid --generate-validator-key --key-file /config/validator.key
    fi

  - |
    cat > /opt/viri/genesis/genesis.json << 'GENESIS'
${genesis_json}
GENESIS

  - |
    cat > /opt/viri/docker-compose.yml << 'COMPOSE'
services:
  validator:
    image: ghcr.io/viri-chain/viri:latest
    container_name: viri-${instance_name}
    ports:
      - "30303:30303"
      - "8545:8545"
      - "8546:8546"
      - "9090:9090"
    volumes:
      - /opt/viri/config:/home/viri/config:ro
      - /opt/viri/genesis:/home/viri/genesis:ro
      - /opt/viri/data:/home/viri/.viri
      - /opt/viri/logs:/home/viri/logs
    environment:
      - VIRI_NODE_NAME=${instance_name}
      - VIRI_LOG_LEVEL=info
      - VIRI_TESTNET=true
      - VIRI_VALIDATOR_MODE=true
      - VIRI_VALIDATOR_KEY=/home/viri/config/validator.key
      - VIRI_RPC_PORT=8545
      - VIRI_API_PORT=8546
      - VIRI_BOOTSTRAP_PEER=/ip4/BOOTSTRAP_PUBLIC_IP/tcp/30303/p2p/BOOTSTRAP_PEER_ID
    restart: unless-stopped
    command: ["virid", "--config", "/home/viri/config/config.json"]
COMPOSE

%{ endif ~}

  - docker compose -f /opt/viri/docker-compose.yml up -d

final_message:
  "Viri node '%s' provisioning complete"
