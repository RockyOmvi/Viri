# Viri Blockchain - Kubernetes Production Deployment
# Includes: StatefulSet, ConfigMap, Secrets, Services, HPA, PDB

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: viri
  labels:
    name: viri

---
# Node ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: viri-config
  namespace: viri
data:
  config.json: |
    {
      "chain": {
        "chain_id": 1337,
        "network_name": "viri-testnet",
        "block_time": "1s",
        "max_block_size": 10485760,
        "max_gas_per_block": 30000000,
        "genesis_file": "/data/genesis/genesis.json"
      },
      "network": {
        "listen_addr": "0.0.0.0:30303",
        "bootstrap_peers": [],
        "max_peers": 100,
        "enable_dht": true,
        "enable_nat": true
      },
      "node": {
        "name": "viri-validator",
        "data_dir": "/data/viri",
        "validator_mode": true,
        "validator_key": "/keys/validator.key",
        "rpc_enabled": true,
        "rpc_port": 8545,
        "api_enabled": true,
        "api_port": 8546,
        "metrics_enabled": true,
        "metrics_port": 9090
      },
      "consensus": {
        "min_stake": 100000,
        "max_validators": 50,
        "epoch_length": 5000,
        "slashing_enabled": true,
        "finality_threshold": "2s"
      },
      "storage": {
        "backend": "leveldb",
        "path": "/data/viri/chaindata",
        "max_state_size": 10737418240,
        "pruning_enabled": true,
        "pruning_keep_recent": 500000,
        "archive_mode": false
      },
      "logging": {
        "level": "info",
        "format": "json",
        "output": "stdout",
        "max_size": 100,
        "max_backups": 3
      },
      "readiness": {
        "min_peers": 2,
        "min_block_height": 1,
        "force_ready": false
      }
    }

---
# P2P Headless Service (for inter-pod communication)
apiVersion: v1
kind: Service
metadata:
  name: viri-p2p
  namespace: viri
  labels:
    app: viri-validator
spec:
  clusterIP: None
  ports:
    - name: p2p
      port: 30303
      targetPort: 30303
    - name: metrics
      port: 9090
      targetPort: 9090
  selector:
    app: viri-validator

---
# RPC Service (Load balanced)
apiVersion: v1
kind: Service
metadata:
  name: viri-rpc
  namespace: viri
  labels:
    app: viri-validator
spec:
  type: ClusterIP
  ports:
    - name: rpc
      port: 8545
      targetPort: 8545
    - name: api
      port: 8546
      targetPort: 8546
  selector:
    app: viri-validator

---
# NodePort Service (for external access)
apiVersion: v1
kind: Service
metadata:
  name: viri-nodeport
  namespace: viri
  labels:
    app: viri-validator
spec:
  type: NodePort
  ports:
    - name: p2p
      port: 30303
      targetPort: 30303
      nodePort: 30303
    - name: rpc
      port: 8545
      targetPort: 8545
      nodePort: 30545
  selector:
    app: viri-validator

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: viri-pdb
  namespace: viri
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: viri-validator

---
# Validator StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: viri-validator
  namespace: viri
  labels:
    app: viri-validator
spec:
  serviceName: viri-p2p
  replicas: 4
  selector:
    matchLabels:
      app: viri-validator
  template:
    metadata:
      labels:
        app: viri-validator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      # Anti-affinity to spread across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - viri-validator
                topologyKey: kubernetes.io/hostname

      containers:
        - name: validator
          image: ghcr.io/viri-chain/viri:latest
          imagePullPolicy: Always
          command: ["virid", "--config", "/config/config.json"]
          ports:
            - name: p2p
              containerPort: 30303
              protocol: TCP
            - name: rpc
              containerPort: 8545
              protocol: TCP
            - name: api
              containerPort: 8546
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP

          env:
            - name: VIRI_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VIRI_DATA_DIR
              value: /data/viri
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data/viri
            - name: genesis
              mountPath: /data/genesis
              readOnly: true
            - name: validator-key
              mountPath: /keys
              readOnly: true

          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"

          livenessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: config
          configMap:
            name: viri-config
        - name: genesis
          configMap:
            name: viri-genesis
            optional: true
        - name: validator-key
          secret:
            secretName: viri-validator-keys
            optional: false

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
        storageClassName: standard

---
# Horizontal Pod Autoscaler (optional)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: viri-hpa
  namespace: viri
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: viri-validator
  minReplicas: 4
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
